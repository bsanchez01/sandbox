*{box-sizing:border-box}

.brand{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.official-logo{width:118px;height:auto;border-radius:8px;background:#f8f8ef;box-shadow:0 8px 20px rgba(0,0,0,.22);border:2px solid rgba(248,248,239,.9)}

.seal{width:58px;height:58px;border-radius:50%;background:#fff;color:var(--cmi-blue);display:grid;place-items:center;font-weight:900;font-size:24px;box-shadow:0 6px 18px rgba(0,0,0,.22);border:4px solid var(--cmi-gold)}
.hero h1{font-size:clamp(26px,4vw,44px);margin:14px 0 8px;line-height:1.04;position:relative;z-index:1}
.hero p{max-width:1050px;margin:0;color:#e9f2ff;font-size:16px;position:relative;z-index:1}
.source-note{margin-top:10px;font-size:12px;color:#dbe9ff;position:relative;z-index:1}
.container{padding:22px;max-width:1500px;margin:0 auto}
.toolbar{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);box-shadow:var(--shadow);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:-34px;position:relative;z-index:3}
.filters{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:12px;align-items:end}
label{font-size:12px;font-weight:800;color:var(--cmi-navy);text-transform:uppercase;letter-spacing:.04em}
select,input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
button{border:0;border-radius:12px;padding:11px 13px;font-weight:800;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--cmi-blue),var(--cmi-blue-2));box-shadow:0 6px 14px rgba(0,56,147,.18)}
button.secondary{background:linear-gradient(135deg,var(--cmi-gold),#c65f00)}
.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(6,minmax(140px,1fr));margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow)}
.kpi .value{font-size:30px;font-weight:900;color:var(--cmi-blue);line-height:1}.kpi .label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;margin-top:7px}.kpi .sub{font-size:12px;color:var(--muted);margin-top:8px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 10px}.section-title h2{margin:0;color:var(--cmi-navy)}

<div id="securityOverlay" class="security-overlay" role="dialog" aria-modal="true" aria-labelledby="securityTitle">
  <form id="securityForm" class="security-card" autocomplete="off">
    <div class="security-logo">CMI</div>
    <h2 id="securityTitle">Secure Dashboard Access</h2>
    <p>This CMI/PSS math transition dashboard is protected. Enter the PIN to continue.</p>
    <label for="securityPin">PIN Code</label>
    <input id="securityPin" name="securityPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="••••" aria-describedby="securityMessage" autofocus />
    <button type="submit">Unlock Dashboard</button>
    <div id="securityMessage" class="security-message" aria-live="polite"></div>
    <div class="security-small">For stronger protection, host this page behind a server login. Client-side PIN protection can discourage casual access but is not a substitute for encrypted/server-side security.</div>
  </form>
</div>
<script>
(function(){
  const ACCESS_PIN = "2026"; // Change this PIN before sharing if needed.
  const SESSION_KEY = "cmi_pss_math_dashboard_unlocked";
  const LOCK_KEY = "cmi_pss_math_dashboard_lock_until";
  const MAX_ATTEMPTS = 5;
  const LOCK_MINUTES = 10;
  const rootClass = document.body.classList;
  const overlay = document.getElementById("securityOverlay");
  const form = document.getElementById("securityForm");
  const pinInput = document.getElementById("securityPin");
  const message = document.getElementById("securityMessage");
  let attempts = 0;

  function unlock(){
    sessionStorage.setItem(SESSION_KEY,"true");
    rootClass.remove("locked");
    if(overlay) overlay.remove();
  }
  function remainingLockMs(){
    const until = Number(localStorage.getItem(LOCK_KEY) || 0);
    return Math.max(0, until - Date.now());
  }
  function showLock(){
    const minutes = Math.ceil(remainingLockMs()/60000);
    message.textContent = `Too many incorrect attempts. Try again in about ${minutes} minute${minutes===1?"":"s"}.`;
    pinInput.disabled = true;
    form.querySelector("button").disabled = true;
  }

  if(sessionStorage.getItem(SESSION_KEY)==="true") return unlock();
  if(remainingLockMs()>0) showLock();

  form.addEventListener("submit", function(e){
    e.preventDefault();
    if(remainingLockMs()>0) return showLock();
    if(pinInput.value === ACCESS_PIN){
      localStorage.removeItem(LOCK_KEY);
      unlock();
      return;
    }
    attempts += 1;
    pinInput.value = "";
    if(attempts >= MAX_ATTEMPTS){
      localStorage.setItem(LOCK_KEY, String(Date.now() + LOCK_MINUTES*60000));
      showLock();
    } else {
      const left = MAX_ATTEMPTS - attempts;
      message.textContent = `Incorrect PIN. ${left} attempt${left===1?"":"s"} remaining.`;
      pinInput.focus();
    }
  });
})();
</script>

FfLoo5ioFSeUR/Z0xUN8ywU2j/PwBVVb5G3ZD2TwAAAABJRU5ErkJggg==" alt="College of the Marshall Islands official logo"/><div><strong>College of the Marshall Islands</strong><br/><span style={{color:'#f8f8ef'}}>PSS Transition Math Data SY2025–2026</span></div></div><h1>Interactive Educational Assessment Dashboard</h1><p>Comprehensive analysis generated from the <strong>{SOURCE_SHEET}</strong> worksheet only. The school list now includes every school in the updated workbook, including <strong>JHS</strong>. Placement is derived from the Level field using the corrected rules, including MATH88/89/AP as Level 2.</p><div className="source-note">Official CMI branding applied: Blue Accent #1 (#3333a1), Blue Accent #2 (#4d4dad), off-white neutrals, and distinct chart colors for each category.</div></header>
<main className="container">
<section className="toolbar"><div className="filters"><div><label>School</label><select value={school} onChange={e=>setSchool(e.target.value)}><option>All</option>{schools.map(x=><option key={x}>{x}</option>)}</select></div><div><label>Gender</label><select value={gender} onChange={e=>setGender(e.target.value)}><option>All</option>{genders.map(x=><option key={x}>{x}</option>)}</select></div><div><label>Placement</label><select value={placement} onChange={e=>setPlacement(e.target.value)}><option>All</option>{placements.map(x=><option key={x}>{x}</option>)}</select></div><div><label>Section</label><select value={section} onChange={e=>setSection(e.target.value)}><option>All</option>{sections.map(x=><option key={x}>{x}</option>)}</select></div><div><label>Search</label><input placeholder="Student, school, level..." value={search} onChange={e=>setSearch(e.target.value)}/></div><div style={{display:'flex',gap:8}}><button onClick={()=>downloadCSV(tableRows)}>Export CSV</button><button className="secondary" onClick={()=>window.print()}>Print</button></div></div></section>
<section className="grid kpis"><div className="card kpi"><div className="value">{kTotal}</div><div className="label">Students Assessed</div><div className="sub">Filtered count</div></div><div className="card kpi"><div className="value">{fmt(kAvg,1)}</div><div className="label">Average Score</div><div className="sub">Mean of averages</div></div><div className="card kpi"><div className="value">{fmt(kMed,1)}</div><div className="label">Median Score</div><div className="sub">Middle performance</div></div><div className="card kpi"><div className="value">{fmt(kHigh,1)}</div><div className="label">Highest Average</div><div className="sub">Top student score</div></div><div className="card kpi"><div className="value">{fmt(kLow,1)}</div><div className="label">Lowest Average</div><div className="sub">Priority support</div></div><div className="card kpi"><div className="value">{fmt(creditPct,1)}%</div><div className="label">Credit Level</div><div className="sub">{fmt(level2Pct,1)}% Level 2</div></div></section>
<section className="section-title"><h2>Executive Summary</h2><span className="pill">Live report updates with filters</span></section><section className="card report"><p><strong>{kTotal}</strong> students are included in the current view, with an overall average score of <strong>{fmt(kAvg,1)}</strong> and median of <strong>{fmt(kMed,1)}</strong>. Placement distribution is {placementLabels.map(p=>`${p}: ${byPlacement[p].length} (${pct(byPlacement[p].length,kTotal)})`).join(', ')}.</p><p>Quarterly averages show {qAvg.map((v,i)=>`Q${i+1} ${fmt(v,1)}`).join(' → ')}. Based on Q4 minus Q1, <strong>{improved}</strong> students improved by at least 5 points, <strong>{stable}</strong> remained stable, and <strong>{declined}</strong> declined by at least 5 points.</p><p>The gender achievement gap in the current view is approximately <strong>{fmt(gap,1)}</strong> points. The highest average school in the current view is <strong>{bySchool[0]?.name||'—'}</strong> at <strong>{fmt(bySchool[0]?.avg,1)}</strong>; the lowest is <strong>{bySchool[bySchool.length-1]?.name||'—'}</strong> at <strong>{fmt(bySchool[bySchool.length-1]?.avg,1)}</strong>.</p></section>
<section className="section-title"><h2>Required Figures: Count and Percentage Disaggregation</h2><span className="pill">Figures update with current filters</span></section><section className="grid charts"><ChartBox type="line" title="Figure 01: Placement Count and Percentage (Level 02, Level 03, and Credit Level)" labels={placementFigureOrder} datasets={[{type:'line',label:'Count',data:placementFigureCounts,borderColor:'#3333A1',backgroundColor:'rgba(51,51,161,.12)',pointBackgroundColor:'#3333A1',pointBorderColor:'#FFFFFF',pointBorderWidth:2,pointRadius:5,tension:.35,yAxisID:'y'},{type:'line',label:'Percentage',data:placementFigurePercentages,borderColor:'#FFA726',backgroundColor:'rgba(255,167,38,.12)',pointBackgroundColor:'#FFA726',pointBorderColor:'#FFFFFF',pointBorderWidth:2,pointRadius:5,tension:.35,yAxisID:'y1'}]} options={{scales:{y:{type:'linear',position:'left',beginAtZero:true,title:{display:true,text:'Student count'},grid:{color:'#eef2f7'}},y1:{type:'linear',position:'right',beginAtZero:true,max:100,title:{display:true,text:'Percentage'},ticks:{callback:v=>v+'%'},grid:{drawOnChartArea:false}},x:{grid:{display:false}}},plugins:{tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': '+ctx.parsed.y+(ctx.dataset.label==='Percentage'?'%':'')}}}}}/><ChartBox type="bar" title="Figure 02: Disaggregation by Gender Count and Percentage" labels={genderFigureLabels} datasets={[{label:'Count',data:genderFigureCounts,backgroundColor:genderFigureLabels.map(g=>genderColors[g]||chartColors[0]),borderColor:'#FFFFFF',borderWidth:2}]} options={{plugins:{tooltip:{callbacks:{afterLabel:ctx=>'Percentage: '+pct(ctx.parsed.y,kTotal)}}}}}/></section><section className="grid charts" style={{marginTop:16}}><ChartBox type="bar" title="Figure 03: Disaggregation by Gender and Placement (Level 02, Level 03, and Credit Level)" labels={genderFigureLabels} datasets={genderPlacementStack} options={{scales:{x:{stacked:false,grid:{display:false}},y:{stacked:false,beginAtZero:true,grid:{color:'#eef2f7'},title:{display:true,text:'Student count'}}},plugins:{tooltip:{callbacks:{afterLabel:ctx=>'Within gender: '+pct(ctx.parsed.y,filtered.filter(r=>r.gender===ctx.label).length)}}}}}/><ChartBox type="bar" title="Figure 04: Placement Counts and Percentage Distribution per School (LHS, MIHS, KAHS, JHS, NIHS, SDA)" labels={schoolFigureOrder} datasets={schoolPlacementDistribution} options={{scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,beginAtZero:true,grid:{color:'#eef2f7'},title:{display:true,text:'Student count'}}},plugins:{tooltip:{callbacks:{afterLabel:ctx=>'Within school: '+pct(ctx.parsed.y,filtered.filter(r=>r.school===ctx.label).length)}}}}}/></section><section className="card report" style={{marginTop:16}}><p><strong>Figure 01</strong> summarizes placement levels by count and percentage: {placementFigureOrder.map((p,i)=>`${p}: ${placementFigureCounts[i]} (${placementFigurePercentages[i]}%)`).join(', ')}.</p><p><strong>Figure 02</strong> shows gender disaggregation: {genderFigureLabels.map((g,i)=>`${g}: ${genderFigureCounts[i]} (${genderFigurePercentages[i]}%)`).join(', ')}. <strong>Figure 03</strong> breaks each gender group into Level 02, Level 03, and Credit Level placements. <strong>Figure 04</strong> compares the six schools by placement count and within-school percentage distribution.</p></section>
<section className="section-title"><h2>Core Visualizations</h2></section><section className="grid charts"><ChartBox type="doughnut" title="Placement Distribution" labels={placementLabels} datasets={[{label:'Students',data:placementCounts,backgroundColor:placementLabels.map(p=>placementColors[p]||chartColors[0]),borderColor:'#FFFFFF',borderWidth:3}]}/><ChartBox type="line" title="Quarter-to-Quarter Performance Trend" labels={['Quarter 1','Quarter 2','Quarter 3','Quarter 4']} datasets={[{label:'Average Score',data:qAvg,borderColor:'#3333A1',backgroundColor:'rgba(51,51,161,.12)',pointBackgroundColor:['#3333A1','#4D4DAD','#8787D1','#FFA726'],pointBorderColor:'#FFFFFF',pointBorderWidth:2,pointRadius:5,tension:.35,fill:true}]}/></section>
<section className="grid charts3" style={{marginTop:16}}><ChartBox type="bar" title="School Average Scores" labels={bySchool.map(s=>s.name)} values={bySchool.map(s=>Number(s.avg.toFixed(1)))}/><ChartBox type="bar" title="Gender Average Scores" labels={byGender.map(g=>g.name)} datasets={[{label:'Average score',data:byGender.map(g=>Number(g.avg.toFixed(1))),backgroundColor:byGender.map(g=>genderColors[g.name]||chartColors[0]),borderColor:'#FFFFFF',borderWidth:2}]}/><ChartBox type="bar" title="Score Distribution" labels={['0–49','50–59','60–69','70–79','80–89','90–100']} datasets={[{label:'Students',data:[filtered.filter(r=>r.avg<50).length,filtered.filter(r=>r.avg>=50&&r.avg<60).length,filtered.filter(r=>r.avg>=60&&r.avg<70).length,filtered.filter(r=>r.avg>=70&&r.avg<80).length,filtered.filter(r=>r.avg>=80&&r.avg<90).length,filtered.filter(r=>r.avg>=90).length],backgroundColor:['#EF5350','#FFA726','#A3A3E0','#8787D1','#4D4DAD','#3333A1'],borderColor:'#FFFFFF',borderWidth:2}]}/></section>
<section className="section-title"><h2>School-Level and Disaggregated Analysis</h2></section><section className="grid charts"><ChartBox type="bar" title="School Placement Comparison" labels={schoolPlacementLabels} datasets={placementStack} options={{scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true}}}}/><div className="card"><h2 style={{fontSize:18,marginTop:0}}>School Rankings</h2><div className="rank-list">{bySchool.map((s,i)=><div className="rank-row" key={s.name}><strong>#{i+1}</strong><div><strong>{s.name}</strong><div className="bar"><span style={{width:Math.max(5,Math.min(100,s.avg))+'%'}}></span></div></div><span>{fmt(s.avg,1)}</span><small>n={s.n}</small></div>)}</div></div></section>
<section className="grid charts3" style={{marginTop:16}}><ChartBox type="bar" title="Section Averages (Top 15)" labels={bySection.map(s=>s.name)} values={bySection.map(s=>Number(s.avg.toFixed(1)))}/><ChartBox type="pie" title="Trend Classification" labels={['Improved','Stable','Declined']} datasets={[{label:'Students',data:[improved,stable,declined],backgroundColor:['#26A69A','#4D4DAD','#EF5350'],borderColor:'#FFFFFF',borderWidth:3}]}/><div className="card report"><h3>Recommendations</h3><ul><li><strong>Level 2:</strong> prioritize diagnostic review, small-group numeracy support, weekly progress checks, and targeted practice on prerequisite algebra skills.</li><li><strong>Level 3:</strong> use bridge modules, monitored problem-solving labs, and acceleration supports to increase Credit-Level readiness.</li><li><strong>Credit Level:</strong> maintain enrichment, dual-credit readiness advising, and peer tutoring roles where appropriate.</li><li><strong>Schools/sections below average:</strong> review pacing, attendance, formative assessment cycles, and intervention participation.</li></ul></div></section>
<section className="section-title"><h2>Student Performance Analysis</h2><select value={sortKey} onChange={e=>setSortKey(e.target.value)} style={{maxWidth:230}}><option value="avg_desc">Sort: Highest Average</option><option value="avg_asc">Sort: Lowest Average</option><option value="change_desc">Sort: Most Improved</option><option value="change_asc">Sort: Largest Decline</option><option value="student">Sort: Student Name</option></select></section>
<section className="grid charts"><div className="card"><h2 style={{fontSize:18,marginTop:0}}>Top Performers</h2><div className="rank-list">{topStudents.map((r,i)=><div className="rank-row" key={r.id+'top'}><strong>#{i+1}</strong><div><strong>{r.student}</strong><br/><small>{r.school} • {r.section}</small></div><span>{fmt(r.avg,1)}</span><small>{r.placement}</small></div>)}</div></div><div className="card"><h2 style={{fontSize:18,marginTop:0}}>At-Risk / Priority Support</h2><div className="rank-list">{riskStudents.map((r,i)=><div className="rank-row" key={r.id+'risk'}><strong>#{i+1}</strong><div><strong>{r.student}</strong><br/><small>{r.school} • {r.section}</small></div><span>{fmt(r.avg,1)}</span><small>{r.placement}</small></div>)}</div></div></section>
<section className="grid charts" style={{marginTop:16}}><div className="card"><h2 style={{fontSize:18,marginTop:0}}>Most Improved</h2><div className="rank-list">{improvers.map((r,i)=><div className="rank-row" key={r.id+'imp'}><strong>#{i+1}</strong><div><strong>{r.student}</strong><br/><small>Q1 {fmt(r.q1,0)} → Q4 {fmt(r.q4,0)}</small></div><span>+{fmt(r.change,1)}</span><small>{r.school}</small></div>)}</div></div><div className="card"><h2 style={{fontSize:18,marginTop:0}}>Largest Declines</h2><div className="rank-list">{decliners.map((r,i)=><div className="rank-row" key={r.id+'dec'}><strong>#{i+1}</strong><div><strong>{r.student}</strong><br/><small>Q1 {fmt(r.q1,0)} → Q4 {fmt(r.q4,0)}</small></div><span>{fmt(r.change,1)}</span><small>{r.school}</small></div>)}</div></div></section>
<section className="section-title"><h2>Student-Level Records</h2><div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}><label style={{marginRight:4}}>Table school</label><select value={tableSchool} onChange={e=>setTableSchool(e.target.value)} style={{maxWidth:220}}><option>All</option>{schools.map(x=><option key={x}>{x}</option>)}</select><span className="pill">{tableRows.length} records shown</span></div></section><section className="table-wrap"><table><thead><tr><th>Student</th><th>School</th><th>Section</th><th>Gender</th><th>Placement</th><th>Level</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>Average</th><th>Q4-Q1</th><th>Trend</th></tr></thead><tbody>{tableRows.map(r=><tr key={r.id}><td><strong>{r.student}</strong></td><td>{r.school}</td><td>{r.section}</td><td>{r.gender}</td><td><span className={'badge '+placementClass(r.placement)}>{r.placement}</span></td><td>{r.level}</td><td>{fmt(r.q1,0)}</td><td>{fmt(r.q2,0)}</td><td>{fmt(r.q3,0)}</td><td>{fmt(r.q4,0)}</td><td><strong>{fmt(r.avg,1)}</strong></td><td>{fmt(r.change,1)}</td><td>{r.trend}</td></tr>)}</tbody></table></section>
<section className="section-title"><h2>Conclusion</h2></section><section className="card report"><p>This dashboard provides a single-source view of transition math readiness using the <strong>{SOURCE_SHEET}</strong> worksheet. Priority areas are students and schools with higher Level 2 concentrations, declining Q1-to-Q4 trends, and averages below the current filtered mean. Use the filters to isolate each school, then align intervention rosters to Level 2 and low-average students while monitoring Level 3 students for movement toward Credit-Level readiness.</p></section><div className="footer">Prepared with official CMI branding for CMI/PSS educational assessment use • Data source: {SOURCE_SHEET} • Generated from updated uploaded workbook including JHS; MATH88/89/AP corrected to Level 2</div>
</main></>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
