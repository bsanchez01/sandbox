  <style>
    /* CMI institutional palette — drawn from the College seal (navy on ivory) */
    :root{--navy:#0b1d5c;--navy-deep:#050f38;--navy-mid:#16307a;--gold:#b9862f;--gold-soft:#e7d6ae;--ink:#16203a;--muted:#5c6478;--line:#e4ddc9;--bg:#f7f4ea;--cream:#f7f4ea;--card:#fffdf7;--warn:#9a6700;--bad:#a4291d;--good:#0d6b4f;--shadow:0 10px 28px rgba(11,29,92,.09);--font-display:'Fraunces',Georgia,'Times New Roman',serif;--font-body:'Inter',ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-body)}button,input,select{font:inherit}button{cursor:pointer}
    /* subtle woven-mat / wave texture behind the whole app, echoing the seal's lagoon scene */
    body{background-image:radial-gradient(circle at 100% 0%,#eef0e0 0,transparent 45%),radial-gradient(circle at 0% 100%,#eef0e0 0,transparent 40%)}
    .top{position:sticky;top:0;z-index:30;background:linear-gradient(120deg,var(--navy-deep),var(--navy) 55%,var(--navy-mid) 100%);color:#fff;padding:16px 24px;box-shadow:0 4px 20px rgba(5,15,56,.28);border-bottom:3px solid var(--gold)}
    .toprow{max-width:1600px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}
    .brand{display:flex;gap:14px;align-items:center}
    .seal{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--navy);font-weight:900;box-shadow:0 0 0 2px var(--gold),0 4px 10px rgba(0,0,0,.25);overflow:hidden;flex:none}
    .seal img{width:100%;height:100%;object-fit:contain;display:block}
    .brand h1{margin:0;font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:.2px}
    .brand small{opacity:.82;font-family:var(--font-mono);font-size:11px;letter-spacing:.4px;text-transform:uppercase}
    .top-actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{border:1px solid var(--line);background:var(--card);color:var(--navy);padding:8px 13px;border-radius:8px;font-weight:600;font-size:13px;transition:background .15s,border-color .15s}
    .btn:hover{background:var(--gold-soft);border-color:var(--gold)}
    .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
    .btn.primary:hover{background:var(--navy-mid)}
    .btn.ghost{background:#ffffff14;color:#fff;border-color:#ffffff4a}
    .btn.ghost:hover{background:#ffffff26;border-color:#ffffff70}
    .btn.danger{color:var(--bad)}
    .shell{max-width:1600px;margin:auto;padding:20px}
    .upload{min-height:72vh;display:grid;place-items:center}
    .upload-card{max-width:780px;width:100%;padding:44px;background:var(--card);border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow);text-align:center;position:relative}
    .upload-card::before{content:"";position:absolute;inset:10px;border:1px solid var(--gold-soft);border-radius:12px;pointer-events:none}
    .upload-card h2{font-family:var(--font-display);font-weight:600;font-size:28px;margin:14px 0 8px}
    .upload-card .seal{width:84px;height:84px;margin:auto}
    .drop{margin:26px 0;padding:34px;border:2px dashed #c3b98c;border-radius:14px;background:#fbf9f1}
    .privacy{background:#fbf1d9;color:#6e4c02;border:1px solid var(--gold-soft);padding:12px 14px;border-radius:10px;text-align:left;font-size:13px}
    .meta{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}
    .pill,.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);padding:6px 10px;border-radius:999px;color:var(--muted);font-size:12.5px}
    .status{padding:10px 12px;border-radius:10px;margin:12px 0}
    .status.bad{background:#fbe9e6;color:var(--bad)}
    .status.ok{background:#e4f3ec;color:var(--good)}
    .tabs{display:flex;gap:4px;overflow:auto;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
    .tab{white-space:nowrap;border:0;background:transparent;color:var(--muted);padding:9px 14px;border-radius:8px;font-weight:600;font-size:13px}
    .tab:hover{background:var(--gold-soft);color:var(--navy)}
    .tab.active{background:var(--navy);color:#fff}
    .layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px}
    .sidebar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;height:calc(100vh - 160px);position:sticky;top:96px;overflow:auto}
    .side-head{display:flex;justify-content:space-between;align-items:center}
    .side-head h3{font-family:var(--font-display);font-size:15px;margin:0;color:var(--navy)}
    .filter{margin:14px 0}
    .filter label{display:block;font-weight:700;margin-bottom:5px;font-size:12.5px;color:var(--navy);text-transform:uppercase;letter-spacing:.3px}
    .filter select,.filter input,.toolbar select,.toolbar input{width:100%;border:1px solid #c9c1a5;border-radius:8px;padding:8px;background:#fff;color:var(--ink)}
    .filter select{min-height:88px}
    .content{min-width:0}
    .kpis{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px}
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:var(--shadow);border-top:3px solid var(--gold)}
    .kpi .label{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
    .kpi .value{font-family:var(--font-display);font-size:27px;font-weight:600;color:var(--navy);margin:5px 0}
    .kpi .note{color:var(--muted);font-size:12px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
    .card h2,.card h3{margin:0 0 12px;font-family:var(--font-display);font-weight:600;color:var(--navy);font-size:16px}
    .chartbox{height:320px}
    .empty{min-height:180px;display:grid;place-items:center;text-align:center;color:var(--muted);background:#faf8f0;border-radius:10px;font-size:13px}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}
    .toolbar>*{width:auto!important}
    .scroll{overflow:auto;max-height:600px;border:1px solid var(--line);border-radius:10px}
    table{border-collapse:collapse;width:100%;background:var(--card)}
    th,td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:13px}
    th{position:sticky;top:0;background:#eceadb;color:var(--navy);z-index:2;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px}
    tr:hover td{background:#faf8ee}
    .num{text-align:right;font-family:var(--font-mono);font-size:12.5px}
    .quality-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .warning{color:var(--warn)}.badtext{color:var(--bad)}.goodtext{color:var(--good)}
    .modal{position:fixed;inset:0;z-index:80;background:rgba(5,15,56,.72);display:grid;place-items:center;padding:20px}
    .modal-body{max-width:800px;width:100%;max-height:90vh;overflow:auto;background:var(--card);padding:24px;border-radius:16px}
    .modal-body h2{font-family:var(--font-display);color:var(--navy)}
    .dictionary{columns:2;column-gap:30px}
    .dictionary p{break-inside:avoid}
    .compact .kpi{padding:10px}
    .compact .chartbox{height:250px}
    .high{--navy:#000f38;--navy-mid:#001d4d;--muted:#33394a;--line:#8a8570;--bg:#fff;--card:#fff}
    .report-only{display:none}
    .report-overlay{position:fixed;inset:0;background:var(--bg);z-index:200;overflow:auto;padding:28px}
    .report-overlay-bar{position:sticky;top:0;z-index:5;display:flex;justify-content:flex-end;gap:8px;padding-bottom:16px;background:var(--bg)}
    .report-cover{text-align:center;padding:36px 0 22px;border-bottom:3px solid var(--gold);margin-bottom:26px}
    .report-cover img{width:84px;height:84px;object-fit:contain;margin-bottom:10px}
    .report-cover h1{font-family:var(--font-display);color:var(--navy);margin:6px 0 2px;font-size:25px}
    .report-cover p{color:var(--muted);margin:2px 0;font-size:13px}
    .report-section{margin-bottom:30px}
    .report-section h2{font-family:var(--font-display);color:var(--navy);border-bottom:2px solid var(--gold-soft);padding-bottom:6px;margin-bottom:14px;font-size:19px}
    .loading{position:fixed;inset:0;background:#f7f4eaee;z-index:100;display:grid;place-items:center;font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--navy)}
    ::selection{background:var(--gold-soft);color:var(--navy)}
    :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
    @media(max-width:1000px){.layout{grid-template-columns:1fr}.sidebar{position:static;height:auto}.kpis{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:700px){.shell{padding:10px}.toprow{align-items:flex-start}.top-actions{justify-content:flex-end}.grid,.kpis,.quality-cards{grid-template-columns:1fr}.dictionary{columns:1}.brand small{display:none}}
    @media print{.top,.tabs,.sidebar,.toolbar,.no-print{display:none!important}.layout{display:block}.shell{padding:0}.card,.kpi{box-shadow:none;break-inside:avoid}.chartbox{height:260px}main.printall .content,main.printall .meta{display:none!important}.report-overlay{position:static;inset:auto;overflow:visible;padding:0;background:#fff;z-index:auto}.report-overlay-bar{display:none!important}.report-section{break-inside:avoid-page}.report-section:not(:first-of-type){break-before:page}}
  </style>
</head>

   {(has('HAS_DEVED_ENGLISH')||has('HAS_DEVED_MATH'))&&<Insight tone={metrics.records&&a.devEither/metrics.records>0.3?'warn':'good'} title="Developmental education load">{fmt(a.devEither)} students ({pct(a.devEither,metrics.records)}) are flagged for developmental English or Math — {fmt(a.devEng)} in English and {fmt(a.devMath)} in Math. This is the group most likely to need tutoring or bridge support.</Insight>}
   {has('WITHDRAWN')&&<Insight tone={a.withdrawnPct>0.1?'bad':a.withdrawnPct>0.05?'warn':'good'} title="Withdrawal rate">{pct(metrics.withdrawn,metrics.records)} of the filtered enrollment is marked withdrawn. {a.withdrawnPct>0.1?'This is a high rate and may warrant a retention review.':'This is within a typical range for this population.'}</Insight>}

   {a.topCampus&&<Insight tone="neutral" title="Campus concentration">{a.topCampus[0]} accounts for {pct(a.topCampus[1],metrics.records)} of enrolled records — the largest share of any campus in this filter.</Insight>}

  </div>
  <div className="grid" style={{marginTop:16}}>
   <ChartCard title="GPA risk bands" field={has('CUM_GPA')?'__GPABAND':null} rows={agedForBand}/>
   <section className="card"><h3>Data completeness — fields with the most blanks</h3>{a.blankRates.length?<div className="scroll"><table><thead><tr><th>Field</th><th className="num">Blank rate</th></tr></thead><tbody>{a.blankRates.map(x=><tr key={x.field}><td>{x.field}</td><td className="num">{(x.rate*100).toFixed(1)}%</td></tr>)}</tbody></table></div>:<div className="empty">No expected fields recognized.</div>}</section>
  </div>
 </>}

ed&&!confirm('Sensitive student fields may be displayed and exported. Continue?'))return;setSensitive(e.target.checked)}}/> Show sensitive fields</label></div><nav className="tabs">{TABS.map((x,i)=><button className={'tab '+(tab===i?'active':'')} onClick={()=>setTab(i)}>{x}</button>)}</nav><div className="layout"><aside className="sidebar no-print"><div className="side-head"><h3>Global filters</h3><button className="btn" onClick={()=>setFilters({})}>Clear</button></div>{FILTERS.filter(([f])=>has(f)).map(([f,label])=><div className="filter" key={f}><label>{label}</label><select multiple value={filters[f]||[]} onChange={e=>setFilters(x=>({...x,[f]:[...e.target.selectedOptions].map(o=>o.value)}))}>{filterOptions(f).map(v=><option value={v}>{v}</option>)}</select></div>)}</aside><article className="content">{panel}</article></div></div>{printAll&&<div className="report-overlay"><div className="report-overlay-bar no-print"><span className="pill" style={{marginRight:'auto'}}>Print preview — charts render below, then use Print or Export</span><button className="btn primary" onClick={()=>window.print()}>Print now</button><button className="btn" onClick={exportReportHTML}>Export as HTML</button><button className="btn" onClick={()=>setPrintAll(false)}>Close preview</button></div><div className="report-cover"><img src={LOGO_SRC} alt="College of the Marshall Islands seal"/><h1>Official Enrollment Dashboard</h1><p>Full Report</p><p>{fileName} · {sheet}</p><p>Generated {new Date().toLocaleString()}</p><p>{fmt(filtered.length)} of {fmt(rows.length)} records{filtered.length!==rows.length?' (filtered view)':''}</p></div><section className="report-section"><h2>Executive Overview</h2><ExecPanel/></section><section className="report-section"><h2>Enrollment Profile</h2><EnrollPanel/></section><section className="report-section"><h2>Academic Profile</h2><AcademicPanel/></section><section className="report-section"><h2>Placement &amp; Developmental Ed</h2><PlacementPanel/></section><section className="report-section"><h2>Student Background</h2><BackgroundPanel/></section><section className="report-section"><h2>Analysis</h2><AnalysisPanel/></section></div>}{dictionary&&<div className="modal" onClick={()=>setDictionary(false)}><section className="modal-body" onClick={e=>e.stopPropagation()}><div className="side-head"><h2>Enrollment data dictionary</h2><button className="btn" onClick={()=>setDictionary(false)}>Close</button></div><p>Descriptions are neutral and do not assign undocumented meanings to institutional codes.</p><div className="dictionary">{EXPECTED.map(h=><p><b>{h}</b><br/><span style={{color:'var(--muted)'}}>{({SONIS_ID:'Institutional student identifier',LASTNAME:'Student last name',FIRSTNAME:'Student first name',MIDDLENAME:'Student middle name',EMAIL:'Student email address',BIRTHDATE:'Date of birth',RMI_SSN:'Sensitive personal identifier',GENDER:'Reported gender category',MARITAL_STATUS:'Reported marital status',BIRTH_COUNTRY_TEXT:'Reported country of birth',CITIZENSHIP_COUNTRY_TEXT:'Reported citizenship country',ETHNICITY:'Reported ethnicity',SCHOOL_YEAR:'Source academic-year code',SEMESTER:'Source semester code',CAMPUS:'Campus or instructional location',DEPARTMENT_TEXT:'Academic department',DIVISION_TEXT:'Academic division or award classification',HS_EDUCATION:'High-school or prior-education source',HS_GRAD_INFO:'High-school graduation information',PROGRAM:'Primary academic program',PROGRAM_START_DATE:'Program start date',DATE_ENROLLED:'Enrollment date',CREDITS_ENROLLED:'Current enrolled credit load',ENROLLMENT_STATUS:'Source enrollment-load status',ADMISSION_STATUS:'Source admission category',ACADEMIC_LEVEL:'Academic classification',ACADEMIC_STANDING_START:'Standing at semester start',ACADEMIC_STANDING_END:'Standing at semester end',HAS_DEVED_ENGLISH:'Developmental English indicator',HAS_DEVED_MATH:'Developmental Math indicator',SEM_CREDITS_EARNED:'Semester credits earned',SEM_GPA:'Semester grade-point average',CUM_CREDITS_ATTEMPTED:'Cumulative credits attempted',CUM_CREDITS_EARNED:'Cumulative credits earned',CUM_GPA:'Cumulative grade-point average',INITIAL_ENROLLMENT:'Initial-enrollment cohort code',PREVIOUS_SY_ATTENDED:'Previous school-year code',PREVIOUS_SEM_ATTENDED:'Previous semester code',SIS_ID:'Secondary student-system identifier',OTHER_PROGRAMS:'Additional program',WITHDRAWN:'Source withdrawal indicator'}[h]||'Source placement category at the indicated point in time.')}</span></p>)}</div></section></div>}{loading&&<div className="loading">Reading workbook…</div>}</main>
