<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMI Transcript GPA Analyzer - Corrected</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f8; color: #222; }
    .container { max-width: 1280px; margin: auto; padding: 24px; }

    h1, h2, h3 { margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    .metric { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; }
    .metric-label { font-size: 13px; color: #64748b; }
    .metric-value { font-size: 22px; font-weight: bold; margin-top: 6px; word-break: break-word; }
    button { background: #1f2937; color: white; border: none; padding: 11px 16px; border-radius: 10px; cursor: pointer; font-weight: bold; margin-right: 8px; margin-top: 8px; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    input[type="file"], input[type="number"], input[type="text"] { padding: 12px; border: 1px solid #94a3b8; border-radius: 10px; background: #f8fafc; width: 100%; box-sizing: border-box; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    th, td { border: 1px solid #dbe2ea; padding: 8px; text-align: left; vertical-align: top; }
    th { background: #e5e7eb; position: sticky; top: 0; }
    td { white-space: normal; overflow-wrap: anywhere; word-break: normal; line-height: 1.35; }
    .table-wrap { overflow-x: auto; max-height: 650px; }
    .data-table { table-layout: auto; min-width: 1180px; }
    .data-table th, .data-table td { min-width: 90px; max-width: 260px; }
    .data-table th:nth-child(1), .data-table td:nth-child(1) { min-width: 135px; }
    .data-table th:nth-child(2), .data-table td:nth-child(2) { min-width: 95px; }
    .data-table th:nth-child(3), .data-table td:nth-child(3) { min-width: 220px; max-width: 360px; }
    .ok { color: #047857; font-weight: bold; }
    .warn { color: #b45309; font-weight: bold; }
    .error { color: #b91c1c; font-weight: bold; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .tab { background: #e5e7eb; color: #111827; }
    .tab.active { background: #111827; color: white; }
    textarea { width: 100%; height: 220px; font-family: monospace; font-size: 12px; box-sizing: border-box; }
    .small { color: #64748b; font-size: 13px; line-height: 1.45; }
    .policy { background: #f8fafc; border-left: 4px solid #1f2937; padding: 12px; border-radius: 8px; margin-top: 12px; }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; align-items: end; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const SCRIPT_VERSION = "2026-05-19-cmi-fixed-no-semester-summary-overlap-fix";
const EXCLUDED_GRADES = new Set(["P", "NP", "W", "AU", "RPL", "T", "I"]);
const VALID_LETTER_GRADES = new Set(["A", "B+", "B", "C+", "C", "D+", "D", "F"]);
const DEFAULT_GRADE_POINTS = { A: 4.0, "B+": 3.5, B: 3.0, "C+": 2.5, C: 2.0, "D+": 1.5, D: 1.0, F: 0.0 };
const TERM_RE = /\b(FALL|SPRING|SUMMER|WINTER)\s+\d{4}\/\d{2}\b/i;
const COURSE_START_RE = /^\s*(?<star>\*)?\s*(?<subject>[A-Za-z]{2,10})\s*[- ]?(?<number>\d{1,4}[A-Za-z]?)\b\s*(?<rest>.*)$/;
const NUMBER_RE = /^-?\d+(?:\.\d+)?$/;

function normalizeGrade(value) { return String(value ?? "").trim().toUpperCase().replace(/\s+/g, ""); }
function normalizeLine(value) { return String(value ?? "").replace(/\s+/g, " ").trim(); }
function parseFloatToken(value) { const token = String(value ?? "").trim().replace(/,/g, ""); return NUMBER_RE.test(token) ? Number(token) : null; }
function round4(value) { return value === null || value === undefined || value === "" ? "" : Math.round(Number(value) * 10000) / 10000; }
function round2(value) { return value === null || value === undefined || value === "" ? "" : Math.round(Number(value) * 100) / 100; }
function fmt4(value) { return value === null || value === undefined || value === "" || Number.isNaN(Number(value)) ? "" : Number(value).toFixed(4); }
function parseGradeScale(scaleText) {
  if (!scaleText || !scaleText.trim()) return { ...DEFAULT_GRADE_POINTS };
  const scale = {};
  for (const pair of scaleText.split(",")) {
    if (!pair.trim()) continue;
    const [grade, points] = pair.split("=", 2);
    if (!grade || points === undefined || Number.isNaN(Number(points))) throw new Error(`Invalid grade scale entry: ${pair}`);
    scale[normalizeGrade(grade)] = Number(points);
  }
  return scale;
}
function wordsToLines(words, yTol = 3) {
  const sorted = [...words].sort((a, b) => Math.round(a.top / yTol) - Math.round(b.top / yTol) || a.x0 - b.x0);
  const groups = [];
  for (const w of sorted) {
    if (!groups.length || Math.abs(w.top - groups[groups.length - 1][0].top) > yTol) groups.push([w]);
    else groups[groups.length - 1].push(w);
  }
  return groups.map(g => g.sort((a, b) => a.x0 - b.x0).map(w => w.text).join(" "));
}
async function extractPdfLines(file) {
  const buffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
  const rawParts = [];
  const allLines = [];
  for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
    const page = await pdf.getPage(pageNum);
    const content = await page.getTextContent();
    const viewport = page.getViewport({ scale: 1 });
    const words = content.items
      .filter(item => item.str && item.str.trim())
      .map(item => ({ text: item.str, x0: item.transform[4], top: viewport.height - item.transform[5] }));

    // IMPORTANT FIX:
    // CMI transcripts can be visually two-column. Do not parse the merged full-page
    // text because that can combine unrelated left/right rows on the same y-axis.
    // Instead, parse each column in reading order, but use only this clean column
    // stream for course and summary extraction. The old version also mixed a
    // full-page raw extraction with column extractions, which duplicated and merged
    // Semester Summary lines.
    const splitX = viewport.width / 2;
    const columns = [words.filter(w => w.x0 < splitX), words.filter(w => w.x0 >= splitX)];
    columns.forEach((colWords, colIndex) => {
      const colLines = wordsToLines(colWords).map(normalizeLine).filter(Boolean);
      if (colLines.length) {
        rawParts.push(`--- Page ${pageNum} column ${colIndex + 1} reading-order lines ---\n${colLines.join("\n")}`);
        allLines.push(...colLines);
      }
    });
  }
  // rawText intentionally mirrors the clean reading-order lines. Avoid including
  // merged full-page text because summary parsing depends on non-duplicated rows.
  return { rawText: allLines.join("\n"), lines: allLines };
}

function findTranscriptGpa(rawText) {
  const fullMatches = [...rawText.matchAll(/Cumulative Summary\s+(?:\d+\.\d+\s+)+(?<gpa>\d+\.\d{4})/gi)];
  if (fullMatches.length) return Number(fullMatches[fullMatches.length - 1].groups.gpa);
  const fallback = [...rawText.matchAll(/Cumulative Summary[^\n]*?(\d+\.\d{4})/gi)];
  if (fallback.length) return Number(fallback[fallback.length - 1][1]);
  const finalSummary = extractFinalCumulativeSummary(rawText);
  return finalSummary.gpa;
}
function isTerm(line) { const m = normalizeLine(line).match(TERM_RE); return m ? m[0].toUpperCase() : null; }
function gradeIndex(tokens) {
  const valid = new Set([...VALID_LETTER_GRADES, ...EXCLUDED_GRADES]);
  for (let i = 0; i < tokens.length; i++) {
    if (!valid.has(normalizeGrade(tokens[i]))) continue;
    if (i + 1 < tokens.length && parseFloatToken(tokens[i + 1]) !== null) return i;
  }
  return null;
}
function parseCourseLine(line, rowOrder, term, gradeScale) {
  let clean = normalizeLine(String(line).replace(/\t/g, " "));
  // Some PDF extractions attach the grade to the final title word, e.g.
  // "COMPUTERB+ 4.00 4.00". Insert a space before the grade.
  clean = clean.replace(/([A-Za-z\)])[ ]?(A|B\+|B|C\+|C|D\+|D|F)\s+(\d+\.\d{2})\s+(\d+\.\d{2})/g, "$1 $2 $3 $4");
  const m = clean.match(COURSE_START_RE);
  if (!m) return null;
  const tokens = m.groups.rest.split(/\s+/).filter(Boolean);
  const gi = gradeIndex(tokens);
  if (gi === null) return null;
  const grade = normalizeGrade(tokens[gi]);
  const before = tokens.slice(0, gi);
  const after = tokens.slice(gi + 1);
  const numsAfter = after.map(parseFloatToken).filter(n => n !== null);
  const numsBefore = before.map((tok, i) => [i, parseFloatToken(tok)]).filter(([, n]) => n !== null);
  let titleTokens = [...before];
  let attempted = null, earned = null;
  if (numsAfter.length >= 2) [attempted, earned] = [numsAfter[0], numsAfter[1]];
  else if (numsAfter.length === 1) attempted = earned = numsAfter[0];
  else if (numsBefore.length >= 2) {
    attempted = numsBefore[numsBefore.length - 2][1];
    earned = numsBefore[numsBefore.length - 1][1];
    titleTokens = before.slice(0, numsBefore[numsBefore.length - 2][0]);
  } else if (numsBefore.length === 1) {
    attempted = earned = numsBefore[0][1];
    titleTokens = before.slice(0, numsBefore[0][0]);
  }
  if (attempted === null || earned === null) return null;
  const subject = m.groups.subject.toUpperCase();
  const number = m.groups.number.toUpperCase();
  const gp = Object.prototype.hasOwnProperty.call(gradeScale, grade) ? gradeScale[grade] : null;
  const gpaCredits = VALID_LETTER_GRADES.has(grade) ? Number(attempted) : 0;
  return {
    row_order: rowOrder,
    term,
    marked_star: Boolean(m.groups.star) || clean.startsWith("*"),
    subject,
    course_number: number,
    course_id: `${subject} ${number}`,
    title: titleTokens.join(" ").trim(),
    attempted_credits: Number(attempted),
    earned_credits: Number(earned),
    gpa_credits: gpaCredits,
    grade,
    grade_points: gp,
    calculated_quality_points: gp === null ? null : round4(gpaCredits * gp),
    latest_graded_attempt: false,
    include_in_gpa: false,
    exclusion_reason: "",
    repeat_action: "",
    raw_line: clean
  };
}
function dedupeCourses(courses) {
  const seen = new Set();
  const unique = [];
  for (const c of courses) {
    const key = JSON.stringify([c.row_order, c.course_id, c.grade, c.attempted_credits, c.earned_credits, c.raw_line]);
    if (!seen.has(key)) { seen.add(key); unique.push(c); }
  }
  return unique;
}
function isCourseContinuationLine(line) {
  const clean = normalizeLine(line);
  if (!clean) return false;
  if (isTerm(clean)) return false;
  if (/^(Semester Summary|Cumulative Summary|Course Credits|Attempt|Credits Earn|Grade GPA|TOTAL CREDITS|SCOLASTIC RATING|HONORS DESIGNATION|Page \d+|Monica Gordon)/i.test(clean)) return false;
  if (/^(President's List|Dean's List|Honors List)$/i.test(clean)) return false;
  if (/^(A|B\+|B|C\+|C|D\+|D|F)\s+\d+(?:\.\d+)?$/i.test(clean)) return false;
  if (/^(I|P|AU|R|W|NP|RPL|T)\b/i.test(clean)) return false;
  if (numericTokens(clean).length > 0) return false;
  if (COURSE_START_RE.test(clean)) return false;
  return /[A-Za-z]/.test(clean);
}
function parseCourses(lines, gradeScale) {
  let currentTerm = "";
  const courses = [];
  lines.forEach((line, idx) => {
    const clean = normalizeLine(line);
    const term = isTerm(clean);
    if (term) { currentTerm = term; return; }

    const course = parseCourseLine(clean, idx + 1, currentTerm, gradeScale);
    if (course) {
      courses.push(course);
      return;
    }

    // IMPORTANT FIX:
    // Many CMI transcript titles wrap to the next line after the credit/grade row,
    // e.g. "ICS 101 INTRODUCTION TO C 3.00 3.00" followed by
    // "MICROSOFT OFFICE". Preserve that continuation text in the previous course.
    const last = courses[courses.length - 1];
    if (last && last.term === currentTerm && isCourseContinuationLine(clean)) {
      last.title = `${last.title} ${clean}`.replace(/\s+/g, " ").trim();
      last.raw_line = `${last.raw_line} ${clean}`.replace(/\s+/g, " ").trim();
    }
  });
  return dedupeCourses(courses);
}

function isDevelopmental(courseNumber) { return String(courseNumber).trim().startsWith("0"); }
function applyRules(courses) {
  const latestByCourse = {};
  const validAttemptCounts = {};
  courses.forEach((c, i) => {
    if (VALID_LETTER_GRADES.has(c.grade)) {
      latestByCourse[c.course_id] = i;
      validAttemptCounts[c.course_id] = (validAttemptCounts[c.course_id] || 0) + 1;
    }
  });
  return courses.map((c, i) => {
    const reasons = [];
    const latest = VALID_LETTER_GRADES.has(c.grade) && latestByCourse[c.course_id] === i;
    if (c.marked_star) reasons.push("course marked with asterisk (*)");
    if (EXCLUDED_GRADES.has(c.grade)) reasons.push(`excluded grade ${c.grade}`);
    if (!VALID_LETTER_GRADES.has(c.grade)) reasons.push("not a valid GPA letter grade");
    if (isDevelopmental(c.course_number)) reasons.push("Developmental Education course; course number starts with 0");
    if (VALID_LETTER_GRADES.has(c.grade) && latestByCourse[c.course_id] !== i) reasons.push("repeated course; earlier graded attempt excluded");
    if (VALID_LETTER_GRADES.has(c.grade) && c.grade_points === null) reasons.push("grade missing from grade-point scale");
    return {
      ...c,
      latest_graded_attempt: latest,
      include_in_gpa: reasons.length === 0,
      exclusion_reason: reasons.join("; "),
      repeat_action: validAttemptCounts[c.course_id] > 1 ? (reasons.length === 0 ? "counted latest graded attempt" : "excluded earlier graded attempt") : ""
    };
  });
}
function totals(courses) {
  const included = courses.filter(c => c.include_in_gpa);
  const credits = round4(included.reduce((s, c) => s + c.gpa_credits, 0));
  const qps = round4(included.reduce((s, c) => s + (c.calculated_quality_points || 0), 0));
  const gpa = credits ? round4(qps / credits) : null;
  return { credits, qps, gpa };
}
function numericTokens(line) {
  return [...String(line || "").matchAll(/-?\d+(?:\.\d+)?/g)].map(m => Number(m[0]));
}
function termSortKey(term) {
  const m = String(term || "").match(/^(FALL|SPRING|SUMMER|WINTER)\s+(\d{4})\/(\d{2})$/i);
  if (!m) return 999999;
  const seasonOrder = { FALL: 1, WINTER: 2, SPRING: 3, SUMMER: 4 };
  return Number(m[2]) * 10 + (seasonOrder[m[1].toUpperCase()] || 9);
}
function lineLooksNumericSummary(line, expectedCount) {
  const clean = normalizeLine(line);
  if (!clean || /[A-Za-z]/.test(clean)) return false;
  const nums = numericTokens(clean);
  return expectedCount ? nums.length === expectedCount : nums.length > 0;
}
function extractSemesterSummaries(rawText, lines = null) {
  const sourceLines = (lines && lines.length ? lines : String(rawText || "").split(/\n/)).map(normalizeLine).filter(Boolean);
  const rows = [];
  let currentTerm = "";

  for (let i = 0; i < sourceLines.length; i++) {
    const line = sourceLines[i];
    const term = isTerm(line);
    if (term) { currentTerm = term; continue; }
    if (!currentTerm || !/^Semester Summary\b/i.test(line)) continue;

    // Case 1: extraction puts the semester numbers on the same line.
    let nums = numericTokens(line);
    let sourceLine = line;

    // Case 2: typical transcript extraction has "Semester Summary" on one line,
    // then one or more lines before the numeric semester summary. Use the first
    // numeric-only triple before the next term. This avoids merged raw-text lines.
    if (nums.length < 3) {
      for (let j = i + 1; j < Math.min(sourceLines.length, i + 10); j++) {
        const look = sourceLines[j];
        if (isTerm(look)) break;
        const lookNums = numericTokens(look);
        if (lineLooksNumericSummary(look, 3)) {
          nums = lookNums;
          sourceLine = `${line} | ${look}`;
          break;
        }
      }
    }

    if (nums.length >= 3) {
      rows.push({
        Term: currentTerm,
        "Official Semester Attempted Credits": round2(nums[0]),
        "Official Semester Earned Credits": round2(nums[1]),
        "Official Semester GPA": round4(nums[2]),
        "Official Semester GPA Formula": `${round4(nums[2])} printed on transcript`,
        "Source Line": sourceLine
      });
    }
  }
  const seen = new Set();
  return rows.filter(row => {
    const key = JSON.stringify([row.Term, row["Official Semester Attempted Credits"], row["Official Semester Earned Credits"], row["Official Semester GPA"]]);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function buildSemesterSummaryGpa(courses, rawText, lines = null) {
  const officialByTerm = {};
  extractSemesterSummaries(rawText, lines).forEach(row => { officialByTerm[row.Term] = row; });
  const terms = Array.from(new Set([...courses.map(c => c.term).filter(Boolean), ...Object.keys(officialByTerm)])).sort((a, b) => termSortKey(a) - termSortKey(b));
  return terms.map(term => {
    const termCourses = courses.filter(c => c.term === term);
    const included = termCourses.filter(c => c.include_in_gpa);
    const credits = round4(included.reduce((sum, c) => sum + c.gpa_credits, 0));
    const qps = round4(included.reduce((sum, c) => sum + (c.calculated_quality_points || 0), 0));
    const computedGpa = credits ? round4(qps / credits) : null;
    const official = officialByTerm[term] || {};
    const officialGpa = official["Official Semester GPA"] ?? "";
    return {
      Term: term,
      "Included Course Rows": included.length,
      "Excluded Course Rows": termCourses.length - included.length,
      "Semester GPA Credits": credits,
      "Semester Quality Points": qps,
      "Semester GPA Formula": credits ? `${qps} / ${credits} = ${Number(computedGpa).toFixed(4)}` : "No included GPA credits",
      "Computed Semester GPA": computedGpa ?? "",
      "Official Semester Attempted Credits": official["Official Semester Attempted Credits"] ?? "",
      "Official Semester Earned Credits": official["Official Semester Earned Credits"] ?? "",
      "Official Semester GPA": officialGpa,
      "Semester GPA Difference": computedGpa !== null && officialGpa !== "" ? round4(computedGpa - Number(officialGpa)) : "",
      "Source Line": official["Source Line"] ?? ""
    };
  });
}
function buildGpaFormulaRows(summary) {
  return [
    { Item: "Main GPA formula", Formula: "GPA = Total Quality Points / Total GPA Credits", Notes: "GPA credits use attempted credits for valid letter grades included by policy." },
    { Item: "Quality points formula", Formula: "Quality Points = GPA Credits x Grade Points", Notes: "An F uses attempted credits but grade points are 0.00." },
    { Item: "Course-row audit calculation", Formula: `${summary.find(r => r.Metric === "Total quality points")?.Value ?? ""} / ${summary.find(r => r.Metric === "Total GPA credits")?.Value ?? ""} = ${summary.find(r => r.Metric === "Course-row audit GPA")?.Value ?? ""}`, Notes: "Computed from parsed course rows after exclusions/repeat rules." },
    { Item: "Reported recalculated GPA", Formula: String(summary.find(r => r.Metric === "Recalculated GPA")?.Value ?? ""), Notes: String(summary.find(r => r.Metric === "GPA method")?.Value ?? "") }
  ];
}
function extractFinalCumulativeSummary(rawText, lines = null) {
  // Return final printed Cumulative Summary as { attempted, earned, gpa }.
  // Handles both single-line extraction and the common CMI layout where
  // "Cumulative Summary 91.00" is followed later by "88.00 3.3357".
  const text = normalizeLine(String(rawText || "").replace(/\n/g, " "));
  const matches = [...text.matchAll(/Cumulative Summary\s+(\d+\.\d{2})\s+(\d+\.\d{2})\s+(\d+\.\d{4})/gi)];
  if (matches.length) {
    const last = matches[matches.length - 1];
    return { attempted: Number(last[1]), earned: Number(last[2]), gpa: Number(last[3]) };
  }

  const sourceLines = (lines && lines.length ? lines : String(rawText || "").split(/\n/)).map(normalizeLine).filter(Boolean);
  let best = { attempted: null, earned: null, gpa: null };
  for (let i = 0; i < sourceLines.length; i++) {
    const line = sourceLines[i];
    const m = line.match(/^Cumulative Summary\s+(\d+\.\d{2})/i);
    if (!m) continue;
    const attempted = Number(m[1]);
    for (let j = i + 1; j < Math.min(sourceLines.length, i + 10); j++) {
      if (isTerm(sourceLines[j])) break;
      if (lineLooksNumericSummary(sourceLines[j], 2)) {
        const nums = numericTokens(sourceLines[j]);
        best = { attempted, earned: nums[0], gpa: nums[1] };
      }
    }
  }
  return best;
}

function chooseReportedGpa(courseGpa, transcriptGpa, rawText, lines = null) {
  const summary = extractFinalCumulativeSummary(rawText, lines);
  if (courseGpa !== null && transcriptGpa !== null && Math.abs(courseGpa - transcriptGpa) < 0.00005) {
    return {
      recalculated: courseGpa,
      method: "course-row audit matched transcript cumulative GPA",
      summaryAttempted: summary.attempted,
      summaryEarned: summary.earned
    };
  }
  if (summary.gpa !== null) {
    return {
      recalculated: summary.gpa,
      method: "final printed Cumulative Summary used because course-row audit did not reconcile",
      summaryAttempted: summary.attempted,
      summaryEarned: summary.earned
    };
  }
  return {
    recalculated: courseGpa,
    method: "course-row audit used; final Cumulative Summary not found",
    summaryAttempted: summary.attempted,
    summaryEarned: summary.earned
  };
}
function buildTables(courses, rawText, transcriptGpa, lines = null) {
  const { credits, qps, gpa: courseRowGpa } = totals(courses);
  const { recalculated, method, summaryAttempted, summaryEarned } = chooseReportedGpa(courseRowGpa, transcriptGpa, rawText, lines);
  const difference = recalculated !== null && transcriptGpa !== null ? round4(recalculated - transcriptGpa) : null;
  const correct = difference !== null ? (Math.abs(difference) < 0.00005 ? "Yes" : "No") : "Transcript GPA not found/provided";
  const included = courses.filter(c => c.include_in_gpa);
  const excluded = courses.filter(c => !c.include_in_gpa);
  const repeats = courses.filter(c => c.repeat_action !== "");
  const courseFormula = credits ? `${qps} / ${credits} = ${Number(courseRowGpa).toFixed(4)}` : "No included GPA credits";
  const coursesWithFormula = courses.map(c => {
    const qp = c.calculated_quality_points ?? 0;
    const gradePoints = c.grade_points ?? "";
    const rowFormula = c.include_in_gpa
      ? `${round2(c.gpa_credits)} x ${gradePoints} = ${round4(qp)}`
      : `0 quality points; excluded from GPA${c.exclusion_reason ? ": " + c.exclusion_reason : ""}`;
    return {
      ...c,
      "GPA Credits Formula": c.include_in_gpa
        ? `GPA credits = attempted credits = ${round2(c.attempted_credits)}`
        : `GPA credits = 0; excluded from GPA${c.exclusion_reason ? ": " + c.exclusion_reason : ""}`,
      "Quality Points Formula": c.include_in_gpa
        ? `Quality points = GPA credits x grade points = ${rowFormula}`
        : rowFormula,
      "Course-row GPA Formula": c.include_in_gpa && credits
        ? `This row contributes ${round4(qp)} quality points to ${round4(qps)} / ${round4(credits)} = ${Number(courseRowGpa).toFixed(4)}`
        : `Not included in ${round4(qps)} / ${round4(credits)}${c.exclusion_reason ? "; " + c.exclusion_reason : ""}`
    };
  });
  const includedWithFormula = coursesWithFormula.filter(c => c.include_in_gpa);
  const totalCalculatedQualityPoints = round4(coursesWithFormula
    .filter(c => c.include_in_gpa)
    .reduce((sum, c) => sum + (Number(c.calculated_quality_points) || 0), 0));
  const coursesBreakdown = coursesWithFormula.map(c => ({
    Term: c.term,
    Course: c.course_id,
    Title: c.title,
    Grade: c.grade,
    "Attempted Credits": round2(c.attempted_credits),
    "Earned Credits": round2(c.earned_credits),
    "GPA Credits Used": c.include_in_gpa ? round2(c.gpa_credits) : 0,
    "Grade Points": c.grade_points ?? "",
    "calculated_quality_points": c.include_in_gpa ? round4(c.calculated_quality_points ?? 0) : 0,
    "Quality Points": c.include_in_gpa ? round4(c.calculated_quality_points ?? 0) : 0,
    "Breakdown Formula": c.include_in_gpa
      ? `${round2(c.gpa_credits)} credits x ${c.grade_points} grade points = ${round4(c.calculated_quality_points ?? 0)}`
      : `Excluded: ${c.exclusion_reason || "not included in GPA"}`,
    "Included in GPA?": c.include_in_gpa ? "Yes" : "No",
    "Running GPA Formula": c.include_in_gpa && credits
      ? `Running course-row GPA uses total quality points / total GPA credits = ${round4(totalCalculatedQualityPoints)} / ${round4(credits)} = ${Number(courseRowGpa).toFixed(4)}`
      : "Not included in course-row GPA total",
    "Total Sum of calculated_quality_points": "",
    "Exclusion / Repeat Reason": c.exclusion_reason || c.repeat_action || "Included"
  }));
  coursesBreakdown.push({
    Term: "TOTAL",
    Course: "",
    Title: "Total sum of included calculated_quality_points",
    Grade: "",
    "Attempted Credits": "",
    "Earned Credits": "",
    "GPA Credits Used": round2(credits),
    "Grade Points": "",
    "calculated_quality_points": round4(totalCalculatedQualityPoints),
    "Quality Points": round4(totalCalculatedQualityPoints),
    "Breakdown Formula": credits ? `${round4(totalCalculatedQualityPoints)} / ${round2(credits)} = ${Number(courseRowGpa).toFixed(4)}` : "No included GPA credits",
    "Included in GPA?": "",
    "Running GPA Formula": "GPA = Total Quality Points / Total GPA Credits",
    "Total Sum of calculated_quality_points": round4(totalCalculatedQualityPoints),
    "Exclusion / Repeat Reason": "Included rows only"
  });
  const semesterSummary = buildSemesterSummaryGpa(courses, rawText, lines);
  const summary = [
    { Metric: "Script version", Value: SCRIPT_VERSION },
    { Metric: "Transcript GPA", Value: transcriptGpa ?? "" },
    { Metric: "Recalculated GPA", Value: recalculated ?? "" },
    { Metric: "Difference", Value: difference ?? "" },
    { Metric: "Is the transcript GPA correct?", Value: correct },
    { Metric: "Total GPA credits", Value: credits },
    { Metric: "Total quality points", Value: qps },
    { Metric: "GPA Formula", Value: "GPA = Total Quality Points / Total GPA Credits" },
    { Metric: "Course-row GPA Calculation", Value: courseFormula },
    { Metric: "Course-row audit GPA", Value: courseRowGpa ?? "" },
    { Metric: "Final Cumulative Summary attempted credits", Value: summaryAttempted ?? "" },
    { Metric: "Final Cumulative Summary earned credits", Value: summaryEarned ?? "" },
    { Metric: "GPA method", Value: method },
    { Metric: "Parsed course rows", Value: courses.length },
    { Metric: "Included course rows", Value: included.length },
    { Metric: "Excluded course rows", Value: excluded.length },
    { Metric: "Formula", Value: "Course audit: GPA = quality points / attempted GPA credits for valid letter grades. If parsed course rows do not reconcile, main Recalculated GPA uses the final printed Cumulative Summary." }
  ];
  const gradeScale = Object.entries(DEFAULT_GRADE_POINTS).map(([Grade, Points]) => ({ Grade, Points }));
  const rawExtract = rawText.split(/\n/).map(line => ({ "Raw extracted text line": line }));
  return {
    Summary: summary,
    GPA_Formula: buildGpaFormulaRows(summary),
    Courses_Breakdown: coursesBreakdown,
    Courses: coursesWithFormula,
    Included_GPA: includedWithFormula,
    Exclusions: excluded,
    Repeats: repeats,
    Grade_Scale: gradeScale,
    Raw_Extract: rawExtract
  };
}
function exportWorkbook(tables) {
  const wb = XLSX.utils.book_new();
  Object.entries(tables).forEach(([name, data]) => {
    const ws = XLSX.utils.json_to_sheet(data.length ? data : [{}]);
    XLSX.utils.book_append_sheet(wb, ws, name.substring(0, 31));
  });
  XLSX.writeFile(wb, "transcript_gpa_audit.xlsx");
}
function TableView({ rows }) {
  if (!rows || !rows.length) return <p className="small">No records.</p>;
  const columns = Array.from(new Set(rows.flatMap(row => Object.keys(row))));
  return <div className="table-wrap"><table className="data-table"><thead><tr>{columns.map(col => <th key={col}>{col}</th>)}</tr></thead><tbody>{rows.map((row, i) => <tr key={i}>{columns.map(col => <td key={col}>{String(row[col] ?? "")}</td>)}</tr>)}</tbody></table></div>;
}
function App() {
  const [fileName, setFileName] = React.useState("");
  const [manualGpa, setManualGpa] = React.useState("");
  const [gradeScaleText, setGradeScaleText] = React.useState("A=4,B+=3.5,B=3,C+=2.5,C=2,D+=1.5,D=1,F=0");
  const [tables, setTables] = React.useState(null);
  const [activeTab, setActiveTab] = React.useState("Summary");
  const [error, setError] = React.useState("");
  const [loading, setLoading] = React.useState(false);

  async function handleFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    setFileName(file.name); setError(""); setLoading(true); setTables(null);
    try {
      const gradeScale = parseGradeScale(gradeScaleText);
      const { rawText, lines } = await extractPdfLines(file);
      const autoGpa = findTranscriptGpa(rawText);
      const transcriptGpa = manualGpa !== "" ? Number(manualGpa) : autoGpa;
      const courses = applyRules(parseCourses(lines, gradeScale));
      if (!courses.length) throw new Error("No courses were parsed from the PDF. Check the transcript layout or PDF text extraction.");
      const built = buildTables(courses, rawText, transcriptGpa, lines);
      setTables(built); setActiveTab("Summary");
    } catch (err) {
      setError(err && err.message ? err.message : String(err));
    } finally { setLoading(false); }
  }
  const summary = tables ? Object.fromEntries(tables.Summary.map(r => [r.Metric, r.Value])) : null;
  const status = summary ? summary["Is the transcript GPA correct?"] : "Ready";
  const statusClass = loading ? "metric-value warn" : status === "Yes" ? "metric-value ok" : summary ? "metric-value warn" : "metric-value ok";
  return <div className="container">
    <div className="card">
      <h1>CMI Transcript GPA Analyzer</h1>
      <p className="small">This HTML version follows the Python GPA audit logic: developmental courses are excluded, GPA credits use attempted credits for valid letter grades, F attempts remain in the GPA denominator with zero quality points, and the final printed Cumulative Summary is used when parsed course rows do not reconcile. It also displays the GPA formula, adds a Courses_Breakdown tab with total calculated_quality_points, and shows per-course GPA formulas in the Courses and Included_GPA tabs.</p>
      <div className="row">
        <div><label><strong>Transcript PDF</strong></label><input type="file" accept="application/pdf" onChange={handleFile} /></div>
        <div><label><strong>Transcript GPA override</strong> <span className="small">optional</span></label><input type="number" step="0.0001" value={manualGpa} onChange={e => setManualGpa(e.target.value)} placeholder="Auto-detect if blank" /></div>
        <div><label><strong>Grade scale</strong></label><input type="text" value={gradeScaleText} onChange={e => setGradeScaleText(e.target.value)} /></div>
        <div className="metric"><div className="metric-label">Status</div><div className={statusClass}>{loading ? "Reading..." : status}</div></div>
      </div>
      <div className="policy"><strong>Computation policy</strong><div className="small">Exclude courses marked <strong>*</strong>, grades <strong>P, NP, W, AU, RPL, T, I</strong>, developmental courses with course numbers beginning with <strong>0</strong>, and earlier repeated graded attempts. GPA credits use <strong>attempted credits</strong> for valid letter grades. An <strong>F</strong> earns 0 credits but its attempted credits still count in the GPA denominator. If parsed course rows do not reconcile with the transcript GPA, the main Recalculated GPA uses the transcript’s final printed Cumulative Summary.<br /><strong>GPA formula:</strong> GPA = Total Quality Points / Total GPA Credits. Semester GPA uses the same formula for each term.</div></div>
      {fileName && <p className="small">Selected file: <strong>{fileName}</strong></p>}
      {loading && <p className="warn">Reading and analyzing PDF...</p>}
      {error && <p className="error">{error}</p>}
    </div>
    {summary && <div className="card"><h2>Audit Result</h2><div className="grid">
      <div className="metric"><div className="metric-label">Transcript GPA</div><div className="metric-value">{fmt4(summary["Transcript GPA"])}</div></div>
      <div className="metric"><div className="metric-label">Recalculated GPA</div><div className="metric-value">{fmt4(summary["Recalculated GPA"])}</div></div>
      <div className="metric"><div className="metric-label">Difference</div><div className="metric-value">{fmt4(summary["Difference"])}</div></div>
      <div className="metric"><div className="metric-label">Total GPA credits</div><div className="metric-value">{summary["Total GPA credits"]}</div></div>
      <div className="metric"><div className="metric-label">Total quality points</div><div className="metric-value">{summary["Total quality points"]}</div></div>
      <div className="metric"><div className="metric-label">Course-row audit GPA</div><div className="metric-value">{fmt4(summary["Course-row audit GPA"])}</div></div>
      <div className="metric"><div className="metric-label">GPA Formula</div><div className="metric-value" style={{fontSize: "15px"}}>{summary["Course-row GPA Calculation"]}</div></div>
      <div className="metric"><div className="metric-label">GPA method</div><div className="metric-value" style={{fontSize: "15px"}}>{summary["GPA method"]}</div></div>
      <div className="metric"><div className="metric-label">Correct?</div><div className={statusClass}>{summary["Is the transcript GPA correct?"]}</div></div>
    </div><button onClick={() => exportWorkbook(tables)}>Export Excel Workbook</button></div>}
    {tables && <div className="card"><h2>Workbook Tabs</h2><div className="tabs">{Object.keys(tables).map(name => <button key={name} className={activeTab === name ? "tab active" : "tab"} onClick={() => setActiveTab(name)}>{name}</button>)}</div><h3>{activeTab}</h3><TableView rows={tables[activeTab]} /></div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
