/* ------------------------------------------------------------------ */
/*  Data pipeline — mirrors fao1_dev_course_award.py                   */
/* ------------------------------------------------------------------ */

const COURSE_REQUIRED = ["Soc Sec", "First Name", "Last Name", "Course", "Credits"];
const AWARD_REQUIRED = ["SONIS_ID", "AMOUNT2"];

const stripBom = (s) => (s ? s.replace(/^\uFEFF/, "") : s);
const trim = (v) => (v == null ? "" : String(v).trim());

function parseCsvFile(file) {
  return new Promise((resolve, reject) => {
    Papa.parse(file, {
      header: true,
      skipEmptyLines: "greedy",
      transformHeader: (h) => stripBom(trim(h)),
      complete: (res) => resolve(res.data),
      error: (err) => reject(err),
    });
  });
}

function requireColumns(rows, required, sourceName) {
  if (!rows.length) throw new Error(`${sourceName} contains no data rows.`);
  const cols = Object.keys(rows[0]);
  const missing = required.filter((c) => !cols.includes(c));
  if (missing.length)
    throw new Error(`${sourceName} is missing required column(s): ${missing.join(", ")}`);
}

function toNumber(v) {
  const s = trim(v).replace(/,/g, "");
  if (s === "") return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN; // NaN = invalid (was non-blank)
}

function buildReport(courseRows, awardRows) {
  requireColumns(courseRows, COURSE_REQUIRED, "DevED courses file");
  requireColumns(awardRows, AWARD_REQUIRED, "FAAwards file");

  const warnings = [];

  // ---- clean courses ----
  let invalidCredits = 0;
  const courses = courseRows.map((r) => {
    let credits = toNumber(r["Credits"]);
    if (Number.isNaN(credits)) {
      invalidCredits += 1;
      credits = null;
    }
    return {
      socSec: trim(r["Soc Sec"]),
      firstName: trim(r["First Name"]),
      lastName: trim(r["Last Name"]),
      course: trim(r["Course"]),
      credits,
      schYr: trim(r["Sch Yr"]),
      semester: trim(r["Semester"]),
    };
  });
  if (invalidCredits)
    warnings.push(`${invalidCredits} invalid Credits value(s) were set to blank.`);

  // ---- clean awards ----
  let invalidAmounts = 0;
  const awards = awardRows.map((r) => {
    let amount = toNumber(r["AMOUNT2"]);
    if (Number.isNaN(amount)) {
      invalidAmounts += 1;
      amount = null;
    }
    return { sonisId: trim(r["SONIS_ID"]), amount };
  });
  if (invalidAmounts)
    warnings.push(`${invalidAmounts} invalid AMOUNT2 value(s) were set to blank.`);

  // ---- aggregate courses by Soc Sec ----
  const courseMap = new Map();
  for (const c of courses) {
    if (!courseMap.has(c.socSec)) {
      courseMap.set(c.socSec, {
        socSec: c.socSec,
        firstName: c.firstName,
        lastName: c.lastName,
        courseSet: new Set(),
        totalCredits: 0,
      });
    }
    const g = courseMap.get(c.socSec);
    if (c.course) g.courseSet.add(c.course);
    if (c.credits != null) g.totalCredits += c.credits;
  }
  const courseSummary = [...courseMap.values()].map((g) => ({
    ...g,
    courses: [...g.courseSet].sort().join(", "),
  }));

  // ---- aggregate awards by SONIS_ID (min_count=1: null if all blank) ----
  const awardMap = new Map();
  for (const a of awards) {
    if (!awardMap.has(a.sonisId)) awardMap.set(a.sonisId, { sum: 0, count: 0 });
    const g = awardMap.get(a.sonisId);
    if (a.amount != null) {
      g.sum += a.amount;
      g.count += 1;
    }
  }
  const awardSummary = [...awardMap.entries()].map(([id, g]) => ({
    socSec: id,
    amount: g.count > 0 ? g.sum : null,
  }));
  const awardLookup = new Map(awardSummary.map((a) => [a.socSec, a.amount]));

  // ---- final merge (left join courses -> awards) ----
  const finalData = courseSummary.map((c) => ({
    socSec: c.socSec,
    firstName: c.firstName,
    lastName: c.lastName,
    totalUsedDevCredits: c.totalCredits,
    amountX: null,
    amountY: awardLookup.has(c.socSec) ? awardLookup.get(c.socSec) : null,
    courses: c.courses,
    totalCourseCredits: c.totalCredits,
  }));

  const courseDetail = courses.map((c) => ({
    socSec: c.socSec,
    firstName: c.firstName,
    lastName: c.lastName,
    schYr: c.schYr,
    semester: c.semester,
    course: c.course,
    creditsInCourse: c.credits,
  }));

  const matched = finalData.filter((r) => r.amountY != null).length;
  const stats = {
    students: finalData.length,
    courseRows: courseDetail.length,
    awardees: awardSummary.length,
    matched,
    totalCredits: finalData.reduce((s, r) => s + (r.totalCourseCredits || 0), 0),
    totalAwarded: finalData.reduce((s, r) => s + (r.amountY || 0), 0),
  };

  return { finalData, awardSummary, courseDetail, warnings, stats };
}

/* ------------------------------------------------------------------ */
/*  Formatting + export helpers                                        */
/* ------------------------------------------------------------------ */

const fmt = (v) =>
  v == null
    ? ""
    : Number(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function exportExcel(report) {
  const wb = XLSX.utils.book_new();

  const finalRows = report.finalData.map((r) => ({
    SocSec: r.socSec,
    "First Name": r.firstName,
    "Last Name": r.lastName,
    "Total Used Development Credits (All Years)": r.totalUsedDevCredits,
    Amount_x: r.amountX,
    Amount_y: r.amountY,
    Courses: r.courses,
    "Total Course Credits": r.totalCourseCredits,
  }));
  const amountRows = report.awardSummary.map((r) => ({ SocSec: r.socSec, Amount: r.amount }));
  const detailRows = report.courseDetail.map((r) => ({
    SocSec: r.socSec,
    "First Name": r.firstName,
    "Last Name": r.lastName,
    "Sch Yr": r.schYr,
    Semester: r.semester,
    Course: r.course,
    "Credits in Course": r.creditsInCourse,
  }));

  const addSheet = (rows, name) => {
    const ws = XLSX.utils.json_to_sheet(rows);
    const cols = rows.length ? Object.keys(rows[0]) : [];
    ws["!cols"] = cols.map((c) => ({
      wch: Math.min(
        Math.max(c.length + 2, ...rows.slice(0, 200).map((r) => String(r[c] ?? "").length + 2), 10),
        45
      ),
    }));
    ws["!autofilter"] = ws["!ref"] ? { ref: ws["!ref"] } : undefined;
    XLSX.utils.book_append_sheet(wb, ws, name);
  };

  addSheet(finalRows, "Final Data");
  addSheet(amountRows, "Amount");
  addSheet(detailRows, "Course Detail");
  XLSX.writeFile(wb, "updated_with_courses.xlsx");
}

function Drop({ label, title, hint, file, onFile }) {
  const inputRef = useRef(null);
  const [over, setOver] = useState(false);
  const handle = (f) => f && onFile(f);
  return (
    <div
      className={`drop ${over ? "over" : ""} ${file ? "loaded" : ""}`}
      role="button"
      tabIndex={0}
      onClick={() => inputRef.current?.click()}
      onKeyDown={(e) => (e.key === "Enter" || e.key === " ") && inputRef.current?.click()}
      onDragOver={(e) => { e.preventDefault(); setOver(true); }}
      onDragLeave={() => setOver(false)}
      onDrop={(e) => { e.preventDefault(); setOver(false); handle(e.dataTransfer.files[0]); }}
    >
      <div className="tag">{label}</div>
      <h3>{title}</h3>
      <p>{hint}</p>
      {file && <div className="file">✓ {file.name}</div>}
      <input
        ref={inputRef}
        type="file"
        accept=".csv,text/csv"
        onChange={(e) => handle(e.target.files[0])}
      />
    </div>
  );
}

function ReportTable({ columns, rows }) {
  return (
    <table>
      <thead>
        <tr>{columns.map((c) => <th key={c.key}>{c.label}</th>)}</tr>
      </thead>
      <tbody>
        {rows.map((r, i) => (
          <tr key={i}>
            {columns.map((c) => (
              <td key={c.key} className={c.cls || ""}>
                {c.render ? c.render(r) : r[c.key]}
              </td>
            ))}
          </tr>
        ))}
      </tbody>
    </table>
  );
}

function App() {
  const [courseFile, setCourseFile] = useState(null);
  const [awardFile, setAwardFile] = useState(null);
  const [report, setReport] = useState(null);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [tab, setTab] = useState("final");

  const run = useCallback(async () => {
    setError("");
    setBusy(true);
    try {
      const [courseRows, awardRows] = await Promise.all([
        parseCsvFile(courseFile),
        parseCsvFile(awardFile),
      ]);
      setReport(buildReport(courseRows, awardRows));
      setTab("final");
    } catch (e) {
      setReport(null);
      setError(e.message || String(e));
    } finally {
      setBusy(false);
    }
  }, [courseFile, awardFile]);

  const today = useMemo(
    () => new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" }),
    []
  );

  const tabs = [
    { id: "final", label: "Final Data", cols: FINAL_COLS, rows: report?.finalData },
    { id: "amount", label: "Amount", cols: AMOUNT_COLS, rows: report?.awardSummary },
    { id: "detail", label: "Course Detail", cols: DETAIL_COLS, rows: report?.courseDetail },
  ];
  const active = tabs.find((t) => t.id === tab);

  return (
    <div className="app">
      <style>{css}</style>

      <div className="topline noprint"></div>
      <header className="masthead noprint">
        <div className="brandrow">
          <div className="cmi-mark" aria-hidden="true">
            <div className="cmi-mark-inner">CMI</div>
          </div>
          <div className="brandtext">
            <div className="org">College of the Marshall Islands</div>
            <h1>Developmental Education Course &amp; Award Report</h1>
            <div className="sub">
              Financial Aid Office reporting tool for consolidating developmental education course usage and award information.
            </div>
          </div>
          <div className="office-chip">Financial Aid Office</div>
        </div>
      </header>

      <main className="wrap">
        <div className="noprint">
          <section className="introcard">
            <h2>Generate the CMI Developmental Education Report</h2>
            <p>Upload both source CSV files, generate the combined report, then export the results to Excel or print them as a PDF.</p>
          </section>
          <div className="uploads">
            <Drop
              label="Input 1"
              title="DevED Courses CSV"
              hint="Requires columns: Soc Sec, First Name, Last Name, Course, Credits"
              file={courseFile}
              onFile={setCourseFile}
            />
            <Drop
              label="Input 2"
              title="FAAwards CSV"
              hint="Requires columns: SONIS_ID, AMOUNT2"
              file={awardFile}
              onFile={setAwardFile}
            />
          </div>

          <div className="bar">
            <button className="btn primary" disabled={!courseFile || !awardFile || busy} onClick={run}>
              {busy ? "Processing…" : "Generate report"}
            </button>
            <button className="btn ghost" disabled={!report} onClick={() => exportExcel(report)}>
              Export Excel (.xlsx)
            </button>
            <button className="btn ghost" disabled={!report} onClick={() => window.print()}>
              Export PDF
            </button>
          </div>

          {error && <div className="error">{error}</div>}
          {report?.warnings.length > 0 && (
            <div className="warns">
              <ul>{report.warnings.map((w, i) => <li key={i}>{w}</li>)}</ul>
            </div>
          )}

          {report ? (
            <>
              <div className="stats">
                <div className="stat"><div className="k">Students</div><div className="v">{report.stats.students}</div></div>
                <div className="stat"><div className="k">Course rows</div><div className="v">{report.stats.courseRows}</div></div>
                <div className="stat"><div className="k">Awardees</div><div className="v">{report.stats.awardees}</div></div>
                <div className="stat"><div className="k">Matched awards</div><div className="v">{report.stats.matched}</div></div>
                <div className="stat"><div className="k">Total credits</div><div className="v">{fmt(report.stats.totalCredits)}</div></div>
                <div className="stat"><div className="k">Matched award total</div><div className="v">${fmt(report.stats.totalAwarded)}</div></div>
              </div>

              <div className="tabs" role="tablist">
                {tabs.map((t) => (
                  <button
                    key={t.id}
                    role="tab"
                    aria-selected={tab === t.id}
                    className={`tab ${tab === t.id ? "active" : ""}`}
                    onClick={() => setTab(t.id)}
                  >
                    {t.label} ({t.rows?.length ?? 0})
                  </button>
                ))}
              </div>
              <div className="tablewrap">
                <ReportTable columns={active.cols} rows={active.rows || []} />
              </div>
            </>
          ) : (
            <div className="empty">
              <h2>No report yet</h2>
              <p>Choose both CSV files above, then select Generate report.</p>
            </div>
          )}
        </div>

        {/* Print layout: all three sheets, one per page */}
        {report && (
          <div className="printonly">
            <div className="print-head">
              <h1>Developmental Education Course &amp; Award Report</h1>
              <span>College of the Marshall Islands · {today}</span>
            </div>
            {tabs.map((t) => (
              <section className="print-section" key={t.id}>
                <div className="print-title">{t.label}</div>
                <ReportTable columns={t.cols} rows={t.rows || []} />
              </section>
            ))}
          </div>
        )}
      </main>
      <footer className="footer noprint">
        <strong>College of the Marshall Islands</strong> · Financial Aid Office · Developmental Education Reporting System
      </footer>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
